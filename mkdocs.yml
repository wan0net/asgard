site_name: Pantheon Blueprint
site_description: An Open reference Architecture for Intelligent Agent Systems
site_url: https://wan0.net/asgard/
repo_url: https://github.com/wan0net/asgard
repo_name: Pantheon Blueprint on GitHub

theme:
  name: material
  font:
    text: Geist
    code: Geist Mono
  palette:
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - docs/stylesheets/extra.css

nav:
  - Home: README.md
  - Understand:
      - Architecture: docs/architecture.md
      - End-to-end flows: docs/data-flows.md
      - Tools and platform: docs/tooling.md
      - Mimir knowledge model: docs/mimir-knowledge-model.md
  - Roles:
      - Odine (Ody): docs/gods/odine.md
      - Mimir: docs/gods/mimir.md
      - Muninn: docs/gods/muninn.md
      - Huginn: docs/gods/huginn.md
      - Heimdall: docs/gods/heimdall.md
  - Deploy:
      - Getting started: docs/getting-started.md
      - Agent-assisted installation: docs/agent-assisted-install.md
      - Integration contracts: docs/integration-contracts.md
      - Transcript outbox: docs/transcript-outbox.md
      - Operations: docs/operations.md
      - Backups and restore: docs/backups.md
  - Assure:
      - Readiness and assurance: docs/assurance.md
      - Security model: docs/security.md
  - Project:
      - Publishing: docs/publishing.md
      - Contributing: CONTRIBUTING.md
      - Security policy: SECURITY.md
      - License: LICENSE.md
