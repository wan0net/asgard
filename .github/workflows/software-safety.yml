name: Software safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-tests:
    name: CI / Public software tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Run every Go test suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find software -name go.mod -print | sort)
          ((${#modules[@]} > 0))
          for module in "${modules[@]}"; do
            (
              cd "$(dirname "${module}")"
              go test ./...
            )
          done
      - name: Run Huginn handoff tests
        working-directory: software
        run: python -m unittest discover -s huginn-handoff -p 'test_*.py' -v
      - name: Run email-control tests
        working-directory: software
        run: python -m unittest discover -s email-control -p 'test_*.py' -v
      - name: Run maintenance-session tests
        working-directory: software
        run: python -m unittest discover -s maintenance-session -p 'test_*.py' -v

  container-builds:
    name: CI / Public container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build browser egress proxy
        run: docker build --tag pantheon-browser-egress-proxy-ci software/browser-egress-proxy
      - name: Build Executor self-host launcher
        run: docker build --tag pantheon-executor-launcher-ci software/executor-launcher

  public-safety:
    name: Safety / Public identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Check public software for private identifiers
        run: python scripts/check-public-safety.py software
      - name: Check software licence declarations
        run: python scripts/check-software-licenses.py software
      - name: Test the public-safety scanner
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  gitleaks:
    name: Safety / Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan complete repository history
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --verbose .
      - name: Scan working tree
        run: |
          "${RUNNER_TEMP}/gitleaks" dir --redact --no-banner --verbose .

  trivy-secrets:
    name: Safety / Trivy secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

  dependency-iac:
    name: Safety / Dependencies and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan dependencies and infrastructure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

  codeql:
    name: Safety / CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python,go
      - name: Build compiled languages
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      - name: Analyze source
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
