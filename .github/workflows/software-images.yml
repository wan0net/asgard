name: Publish public software images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - software/browser-egress-proxy/**
      - software/executor-launcher/**
      - software/huginn-handoff/**
      - software/email-control/**
      - software/maintenance-session/**
      - .github/workflows/software-images.yml
  push:
    branches:
      - main
    paths:
      - software/browser-egress-proxy/**
      - software/executor-launcher/**
      - software/huginn-handoff/**
      - software/email-control/**
      - software/maintenance-session/**
      - .github/workflows/software-images.yml

permissions: {}

jobs:
  validate:
    name: Validate / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: browser-egress-proxy
            image: ghcr.io/wan0net/asgard-browser-egress-proxy
            context: software/browser-egress-proxy
            dockerfile: software/browser-egress-proxy/Dockerfile
            trivyignores: ""
          - component: executor-launcher
            image: ghcr.io/wan0net/asgard-executor-launcher
            context: software/executor-launcher
            dockerfile: software/executor-launcher/Dockerfile
            trivyignores: software/executor-launcher/.trivyignore.yaml
          - component: huginn-handoff
            image: ghcr.io/wan0net/asgard-huginn-handoff
            context: software/huginn-handoff
            dockerfile: software/huginn-handoff/Dockerfile
            trivyignores: ""
          - component: email-control
            image: ghcr.io/wan0net/asgard-email-control
            context: software
            dockerfile: software/email-control/Dockerfile
            trivyignores: ""
          - component: maintenance-session
            image: ghcr.io/wan0net/asgard-maintenance-session
            context: software/maintenance-session
            dockerfile: software/maintenance-session/Dockerfile
            trivyignores: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build exact image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan exact image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: ${{ matrix.trivyignores }}

  publish:
    name: Publish / ${{ matrix.component }}
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: browser-egress-proxy
            image: ghcr.io/wan0net/asgard-browser-egress-proxy
            context: software/browser-egress-proxy
            dockerfile: software/browser-egress-proxy/Dockerfile
          - component: executor-launcher
            image: ghcr.io/wan0net/asgard-executor-launcher
            context: software/executor-launcher
            dockerfile: software/executor-launcher/Dockerfile
          - component: huginn-handoff
            image: ghcr.io/wan0net/asgard-huginn-handoff
            context: software/huginn-handoff
            dockerfile: software/huginn-handoff/Dockerfile
          - component: email-control
            image: ghcr.io/wan0net/asgard-email-control
            context: software
            dockerfile: software/email-control/Dockerfile
          - component: maintenance-session
            image: ghcr.io/wan0net/asgard-maintenance-session
            context: software/maintenance-session
            dockerfile: software/maintenance-session/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image with attestations
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
      - name: Record immutable image
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## ${IMAGE}"
            echo
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- Promotion reference: \`${IMAGE}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
